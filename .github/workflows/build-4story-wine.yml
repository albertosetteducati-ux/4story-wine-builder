name: Build 4Story GameGuard GameNative Proton 11 x86_64 v8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget curl unzip flex bison gettext autoconf automake libtool \
            pkg-config mingw-w64 gcc-multilib g++-multilib xz-utils zstd python3 \
            libfreetype6-dev libfreetype6-dev:i386 libpng-dev libpng-dev:i386 \
            zlib1g-dev zlib1g-dev:i386

      - name: Clone exact GameNative Proton 11 source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch proton_11.0 \
            https://github.com/GameNative/proton-wine.git wine-src
          EXPECTED_GAMENATIVE_SHA='f7c016668db739f563e3d4781c27ed085843d63a'
          ACTUAL_GAMENATIVE_SHA="$(git -C wine-src rev-parse HEAD)"
          echo "GameNative Proton 11 commit: $ACTUAL_GAMENATIVE_SHA"
          test "$ACTUAL_GAMENATIVE_SHA" = "$EXPECTED_GAMENATIVE_SHA" || {
            echo "Unexpected GameNative proton_11.0 commit" >&2
            exit 1
          }
          grep -F "Wine version 11.0" wine-src/VERSION

      - name: Download and verify GameGuard compatibility patches
        run: |
          set -euo pipefail
          mkdir -p gg-patches
          BASE='https://raw.githubusercontent.com/Krzysztof977/mu-online-linux/v0.1.0/patches'
          names=(
            0001-ntdll-ntloaddriver-scm.patch
            0002-ntdll-wow64-stack-semantics.patch
            0003-kernelbase-urlescape-sentinel.patch
            0004-ntoskrnl-gameguard-compat.patch
          )
          sums=(
            128398b6cc9a8be12771df8636e6ab5db96dc68c2ed4dc275045211354e79ab8
            507dcf28948909a3d869b58f5ff1aa1272a1c6b6abeb2d42e6350c6ae9cad8a0
            98478fac80966bffac650a76e870ba1a39a809eb5d20d783dd8486cb9b628572
            d40695dcc32b3f2f5343e4bf1eef5ae7a212da4fdb0f454209f0c1d833721399
          )
          for i in "${!names[@]}"; do
            curl -fL "$BASE/${names[$i]}" -o "gg-patches/${names[$i]}"
            echo "${sums[$i]}  gg-patches/${names[$i]}" | sha256sum -c -
          done

      - name: Preflight ALL custom compatibility changes
        run: |
          set -euo pipefail
          failures=0

          # 0002 is ported explicitly below because Proton 11's thread/virtual
          # code differs from the Wine 11.6 tree the original patch targets.
          # 0003 and 0004 must still apply cleanly before we mutate anything.
          for p in \
            gg-patches/0003-kernelbase-urlescape-sentinel.patch \
            gg-patches/0004-ntoskrnl-gameguard-compat.patch
          do
            if git -C wine-src apply --check "../$p"; then
              echo "OK: $p"
            else
              echo "FAIL: $p"
              failures=$((failures+1))
            fi
          done

          python3 - <<'PY' || failures=$((failures+1))
          from pathlib import Path

          root = Path("wine-src")
          mf = (root / "dlls/ntdll/Makefile.in").read_text()
          spec = (root / "dlls/ntdll/ntdll.spec").read_text()
          thread = (root / "dlls/ntdll/unix/thread.c").read_text()
          priv = (root / "dlls/ntdll/unix/unix_private.h").read_text()
          virt = (root / "dlls/ntdll/unix/virtual.c").read_text()
          th = (root / "dlls/kernel32/toolhelp.c").read_text()
          kspec = (root / "dlls/kernel32/kernel32.spec").read_text()
          android_virt = (root / "android/patches/dlls_ntdll_unix_virtual.c.patch").read_text()

          wow_call = "virtual_alloc_thread_stack( &stack, 0, limit, reserve_size, commit_size, TRUE )"

          checks = {
              "ntdll Makefile anchor":
                  ("\tdebugbuffer.c \\" in mf.splitlines() and
                   "\tenv.c \\" in mf.splitlines() and
                   "\tdriver.c \\" not in mf.splitlines()),
              "NtLoadDriver export": "@ stdcall -syscall NtLoadDriver(ptr)" in spec,
              "NtUnloadDriver export": "@ stdcall -syscall NtUnloadDriver(ptr)" in spec,

              "0002 kernel-stack call":
                  "virtual_alloc_thread_stack( &stack, limit_4g, 0, kernel_stack_size, kernel_stack_size, FALSE )" in thread,
              "0002 64-bit stack call":
                  "virtual_alloc_thread_stack( &stack, limit_4g, 0, 0x40000, 0x40000, TRUE )" in thread,
              "0002 32/native stack calls x2": thread.count(wow_call) == 2,
              "0002 emulator-stack call":
                  "virtual_alloc_thread_stack( &stack, limit_4g, 0, chpev2_stack_size, chpev2_stack_size, FALSE )" in thread,
              "0002 prototype":
                  "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page );" in priv,
              "0002 implementation signature":
                  "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page )" in virt,
              "0002 guard-page anchor":
                  "    /* setup no access guard page */\n    if (guard_page)\n    {\n" in virt,
              "0002 StackLimit anchor":
                  "    stack->StackLimit = (char *)view->base + (guard_page ? 2 * host_page_size : 0);" in virt,
              "Android virtual patch does not overlap 0002 stack function":
                  "virtual_alloc_thread_stack" not in android_virt,

              "Toolhelp snapshot struct": "    int         module_offset;\n    char        data[1];\n" in th,
              "Toolhelp locals": "    ULONG               num_pcs, num_thd, num_mod;\n" in th,
              "Toolhelp flags": "if (!(flags & (TH32CS_SNAPPROCESS|TH32CS_SNAPTHREAD|TH32CS_SNAPMODULE)))" in th,
              "Toolhelp heap FIXME": 'if (flags & TH32CS_SNAPHEAPLIST)FIXME("Unimplemented: heap list snapshot\\n");' in th,
              "Heap32ListFirst stub": 'BOOL WINAPI Heap32ListFirst(HANDLE hSnapshot, LPHEAPLIST32 lphl)' in th,
              "Heap32ListNext spec stub": "@ stub Heap32ListNext" in kspec,
          }

          bad = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("OK: " if ok else "FAIL: ") + name)
          if bad:
              raise SystemExit("Preflight failed: " + ", ".join(bad))
          PY

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures compatibility preflight group(s) failed. Nothing was built."
            exit 1
          fi

      - name: Apply NtLoadDriver port for GameNative Proton 11
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("wine-src")
          patch = Path("gg-patches/0001-ntdll-ntloaddriver-scm.patch").read_text().splitlines()

          marker = "+++ b/dlls/ntdll/driver.c"
          i = patch.index(marker) + 1
          while i < len(patch) and not patch[i].startswith("@@"):
              i += 1
          if i == len(patch):
              raise SystemExit("driver.c hunk not found")
          i += 1

          out = []
          while i < len(patch):
              line = patch[i]
              if line.startswith("--- a/") or line.startswith("--- /dev/null"):
                  break
              if line.startswith("+") and not line.startswith("+++"):
                  out.append(line[1:])
              elif line.startswith(" "):
                  out.append(line[1:])
              i += 1

          driver = "\n".join(out) + "\n"
          if "NTSTATUS WINAPI NtLoadDriver" not in driver or "NTSTATUS WINAPI NtUnloadDriver" not in driver:
              raise SystemExit("extracted driver.c is incomplete")
          (root / "dlls/ntdll/driver.c").write_text(driver)

          mf_path = root / "dlls/ntdll/Makefile.in"
          mf = mf_path.read_text()
          old = "\tdebugbuffer.c \\\n\tenv.c \\\n"
          new = "\tdebugbuffer.c \\\n\tdriver.c \\\n\tenv.c \\\n"
          if old not in mf:
              raise SystemExit("ntdll Makefile anchor changed")
          mf_path.write_text(mf.replace(old, new, 1))

          spec_path = root / "dlls/ntdll/ntdll.spec"
          spec = spec_path.read_text()
          for old, new in (
              ("@ stdcall -syscall NtLoadDriver(ptr)", "@ stdcall NtLoadDriver(ptr)"),
              ("@ stdcall -syscall NtUnloadDriver(ptr)", "@ stdcall NtUnloadDriver(ptr)"),
          ):
              if old not in spec:
                  raise SystemExit("ntdll.spec anchor missing: " + old)
              spec = spec.replace(old, new, 1)
          spec_path.write_text(spec)
          PY

      - name: Apply WoW64 stack semantics port and remaining GameGuard patches
        run: |
          set -euo pipefail

          # Manual, source-matched port of patch 0002 for GameNative Proton 11.
          # Same semantics as the Wine 11.6 patch; only the context differs.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("wine-src")
          thread_path = root / "dlls/ntdll/unix/thread.c"
          priv_path = root / "dlls/ntdll/unix/unix_private.h"
          virt_path = root / "dlls/ntdll/unix/virtual.c"

          thread = thread_path.read_text()

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(label + ": anchor not found")
              return text.replace(old, new, 1)

          thread = once(
              thread,
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, kernel_stack_size, kernel_stack_size, FALSE )",
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, kernel_stack_size, kernel_stack_size, FALSE, FALSE )",
              "kernel stack call"
          )
          thread = once(
              thread,
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, 0x40000, 0x40000, TRUE )",
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, 0x40000, 0x40000, TRUE, FALSE )",
              "64-bit stack call"
          )

          common = "virtual_alloc_thread_stack( &stack, 0, limit, reserve_size, commit_size, TRUE )"
          if thread.count(common) != 2:
              raise SystemExit("expected exactly two 32/native stack calls")
          thread = thread.replace(
              common,
              "virtual_alloc_thread_stack( &stack, 0, limit, reserve_size, commit_size, TRUE, TRUE )",
              1
          )
          thread = thread.replace(
              common,
              "virtual_alloc_thread_stack( &stack, 0, limit, reserve_size, commit_size, TRUE, FALSE )",
              1
          )

          thread = once(
              thread,
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, chpev2_stack_size, chpev2_stack_size, FALSE )",
              "virtual_alloc_thread_stack( &stack, limit_4g, 0, chpev2_stack_size, chpev2_stack_size, FALSE, FALSE )",
              "emulator stack call"
          )
          thread_path.write_text(thread)

          priv = priv_path.read_text()
          priv = once(
              priv,
              "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page );",
              "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page,\n"
              "                                            BOOL use_commit_size );",
              "virtual_alloc_thread_stack prototype"
          )
          priv_path.write_text(priv)

          virt = virt_path.read_text()
          virt = once(
              virt,
              "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page )",
              "SIZE_T reserve_size, SIZE_T commit_size, BOOL guard_page,\n"
              "                                     BOOL use_commit_size )",
              "virtual_alloc_thread_stack implementation signature"
          )

          guard_anchor = "    /* setup no access guard page */\n    if (guard_page)\n    {\n"
          guard_new = (
              "    /* setup no access guard page */\n"
              "    if (guard_page && use_commit_size)\n"
              "    {\n"
              "        char *stack_base = (char *)view->base + view->size;\n"
              "        char *stack_limit = stack_base - commit_size;\n"
              "        char *guard = stack_limit - host_page_size;\n\n"
              "        /* Keep the full stack mapping committed as in stock Wine. */\n"
              "        set_page_vprot( view->base, host_page_size, 0 );\n"
              "        set_page_vprot( guard, host_page_size,\n"
              "                        VPROT_READ | VPROT_WRITE | VPROT_COMMITTED | VPROT_GUARD );\n"
              "        mprotect_range( view->base, host_page_size, 0, 0 );\n"
              "        mprotect_range( guard, host_page_size, 0, 0 );\n"
              "    }\n"
              "    else if (guard_page)\n"
              "    {\n"
          )
          virt = once(virt, guard_anchor, guard_new, "guard-page block")

          stack_limit = "    stack->StackLimit = (char *)view->base + (guard_page ? 2 * host_page_size : 0);"
          stack_limit_new = (
              "    if (use_commit_size)\n"
              "        stack->StackLimit = (char *)stack->StackBase - commit_size;\n"
              "    else\n"
              "        stack->StackLimit = (char *)view->base + (guard_page ? 2 * host_page_size : 0);"
          )
          virt = once(virt, stack_limit, stack_limit_new, "StackLimit assignment")
          virt_path.write_text(virt)
          PY

          # 0003 and 0004 were both proven clean by the preflight above.
          git -C wine-src apply ../gg-patches/0003-kernelbase-urlescape-sentinel.patch
          git -C wine-src apply ../gg-patches/0004-ntoskrnl-gameguard-compat.patch
          git -C wine-src diff --check

      - name: Apply Toolhelp heap-list implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("wine-src")
          toolhelp = root / "dlls/kernel32/toolhelp.c"
          spec = root / "dlls/kernel32/kernel32.spec"
          text = toolhelp.read_text()

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(label + ": anchor not found")
              text = text.replace(old, new, 1)

          rep(
              "    int         module_count;\n"
              "    int         module_pos;\n"
              "    int         module_offset;\n"
              "    char        data[1];\n",
              "    int         module_count;\n"
              "    int         module_pos;\n"
              "    int         module_offset;\n"
              "    int         heap_count;\n"
              "    int         heap_pos;\n"
              "    int         heap_offset;\n"
              "    char        data[1];\n",
              "snapshot layout"
          )

          anchor = "static BOOL fetch_process_thread( DWORD flags, SYSTEM_PROCESS_INFORMATION** pspi,\n"
          if anchor not in text:
              raise SystemExit("fetch_process_thread anchor not found")

          helpers = r'''/*
           * Read Toolhelp heap identifiers from the target PEB.
           */
          static BOOL fetch_heap_list( DWORD process, DWORD flags, HEAPLIST32 **heap_list, ULONG *num )
          {
              PROCESS_BASIC_INFORMATION pbi;
              HANDLE hProcess;
              PVOID *heaps = NULL;
              PEB peb;
              ULONG i;
              BOOL ret = FALSE;

              *heap_list = NULL;
              *num = 0;
              if (!(flags & TH32CS_SNAPHEAPLIST)) return TRUE;

              if (process)
              {
                  hProcess = OpenProcess( PROCESS_VM_READ | PROCESS_QUERY_INFORMATION, FALSE, process );
                  if (!hProcess) return FALSE;
              }
              else hProcess = GetCurrentProcess();

              if (!set_ntstatus( NtQueryInformationProcess( hProcess, ProcessBasicInformation,
                                                  &pbi, sizeof(pbi), NULL )))
                  goto out;
              if (!ReadProcessMemory( hProcess, pbi.PebBaseAddress, &peb, sizeof(peb), NULL ))
                  goto out;

              if (!peb.NumberOfHeaps)
              {
                  ret = TRUE;
                  goto out;
              }
              if (peb.NumberOfHeaps > 0x10000)
              {
                  SetLastError( ERROR_BAD_LENGTH );
                  goto out;
              }

              heaps = HeapAlloc( GetProcessHeap(), 0, peb.NumberOfHeaps * sizeof(*heaps) );
              if (!heaps)
              {
                  SetLastError( ERROR_NOT_ENOUGH_MEMORY );
                  goto out;
              }
              if (!ReadProcessMemory( hProcess, peb.ProcessHeaps, heaps,
                            peb.NumberOfHeaps * sizeof(*heaps), NULL ))
                  goto out;

              *heap_list = HeapAlloc( GetProcessHeap(), HEAP_ZERO_MEMORY,
                            peb.NumberOfHeaps * sizeof(**heap_list) );
              if (!*heap_list)
              {
                  SetLastError( ERROR_NOT_ENOUGH_MEMORY );
                  goto out;
              }

              for (i = 0; i < peb.NumberOfHeaps; ++i)
              {
                  (*heap_list)[i].dwSize = sizeof(HEAPLIST32);
                  (*heap_list)[i].th32ProcessID = process ? process : GetCurrentProcessId();
                  (*heap_list)[i].th32HeapID = (ULONG_PTR)heaps[i];
                  (*heap_list)[i].dwFlags = (heaps[i] == peb.ProcessHeap) ? HF32_DEFAULT : 0;
              }

              *num = peb.NumberOfHeaps;
              ret = TRUE;

          out:
              if (!ret)
              {
                  HeapFree( GetProcessHeap(), 0, *heap_list );
                  *heap_list = NULL;
                  *num = 0;
              }
              HeapFree( GetProcessHeap(), 0, heaps );
              if (process) CloseHandle( hProcess );
              return ret;
          }

          static void fill_heap_list( struct snapshot *snap, ULONG *offset, HEAPLIST32 *heap_list, ULONG num )
          {
              snap->heap_count = num;
              snap->heap_pos = 0;
              if (!num) return;
              snap->heap_offset = *offset;
              memcpy( &snap->data[*offset], heap_list, num * sizeof(*heap_list) );
              *offset += num * sizeof(*heap_list);
          }

          '''
          text = text.replace(anchor, helpers + anchor, 1)

          rep(
              "    SYSTEM_PROCESS_INFORMATION* spi = NULL;\n"
              "    LDR_DATA_TABLE_ENTRY *mod = NULL;\n"
              "    ULONG               num_pcs, num_thd, num_mod;\n",
              "    SYSTEM_PROCESS_INFORMATION* spi = NULL;\n"
              "    LDR_DATA_TABLE_ENTRY *mod = NULL;\n"
              "    HEAPLIST32          *heap_list = NULL;\n"
              "    ULONG               num_pcs = 0, num_thd = 0, num_mod = 0, num_heap = 0;\n",
              "snapshot locals"
          )

          rep(
              "if (!(flags & (TH32CS_SNAPPROCESS|TH32CS_SNAPTHREAD|TH32CS_SNAPMODULE)))",
              "if (!(flags & (TH32CS_SNAPPROCESS|TH32CS_SNAPTHREAD|TH32CS_SNAPMODULE|TH32CS_SNAPHEAPLIST)))",
              "supported flags"
          )

          rep(
              "    if (fetch_module( process, flags, &mod, &num_mod ) &&\n"
              "        fetch_process_thread( flags, &spi, &num_pcs, &num_thd ))\n",
              "    if (fetch_module( process, flags, &mod, &num_mod ) &&\n"
              "        fetch_process_thread( flags, &spi, &num_pcs, &num_thd ) &&\n"
              "        fetch_heap_list( process, flags, &heap_list, &num_heap ))\n",
              "snapshot fetch chain"
          )

          rep(
              '        if (flags & TH32CS_SNAPHEAPLIST)FIXME("Unimplemented: heap list snapshot\\n");\n',
              '        if (flags & TH32CS_SNAPHEAPLIST) sect_size += num_heap * sizeof(HEAPLIST32);\n',
              "heap snapshot allocation"
          )

          rep(
              "            fill_module( snap, &offset, process, mod, num_mod );\n"
              "            fill_process( snap, &offset, spi, num_pcs );\n"
              "            fill_thread( snap, &offset, spi, num_thd );\n",
              "            fill_module( snap, &offset, process, mod, num_mod );\n"
              "            fill_process( snap, &offset, spi, num_pcs );\n"
              "            fill_thread( snap, &offset, spi, num_thd );\n"
              "            fill_heap_list( snap, &offset, heap_list, num_heap );\n",
              "snapshot fill"
          )

          rep(
              "    HeapFree( GetProcessHeap(), 0, mod );\n"
              "    HeapFree( GetProcessHeap(), 0, spi );\n\n"
              "    if (!hSnapShot) return INVALID_HANDLE_VALUE;\n",
              "    HeapFree( GetProcessHeap(), 0, mod );\n"
              "    HeapFree( GetProcessHeap(), 0, spi );\n"
              "    HeapFree( GetProcessHeap(), 0, heap_list );\n\n"
              "    if (!hSnapShot) return INVALID_HANDLE_VALUE;\n",
              "snapshot cleanup"
          )

          old_stub = '''/************************************************************************
           *              Heap32ListFirst (KERNEL32.@)
           *
           */
          BOOL WINAPI Heap32ListFirst(HANDLE hSnapshot, LPHEAPLIST32 lphl)
          {
              FIXME(": stub\\n");
              return FALSE;
          }
          '''
          new_stub = '''/************************************************************************
           *              heap_list_next
           */
          static BOOL heap_list_next( HANDLE hSnapshot, LPHEAPLIST32 lphl, BOOL first )
          {
              struct snapshot *snap;
              BOOL ret = FALSE;

              if (lphl->dwSize < sizeof(HEAPLIST32))
              {
                  SetLastError( ERROR_INSUFFICIENT_BUFFER );
                  WARN("Result buffer too small (%lu)\\n", lphl->dwSize );
                  return FALSE;
              }

              if ((snap = MapViewOfFile( hSnapshot, FILE_MAP_ALL_ACCESS, 0, 0, 0 )))
              {
                  if (first) snap->heap_pos = 0;
                  if (snap->heap_pos < snap->heap_count)
                  {
            LPHEAPLIST32 he = (HEAPLIST32 *)&snap->data[snap->heap_offset];
            *lphl = he[snap->heap_pos++];
            ret = TRUE;
                  }
                  else SetLastError( ERROR_NO_MORE_FILES );
                  UnmapViewOfFile( snap );
              }
              return ret;
          }

          /************************************************************************
           *              Heap32ListFirst (KERNEL32.@)
           */
          BOOL WINAPI Heap32ListFirst( HANDLE hSnapshot, LPHEAPLIST32 lphl )
          {
              return heap_list_next( hSnapshot, lphl, TRUE );
          }

          /************************************************************************
           *              Heap32ListNext (KERNEL32.@)
           */
          BOOL WINAPI Heap32ListNext( HANDLE hSnapshot, LPHEAPLIST32 lphl )
          {
              return heap_list_next( hSnapshot, lphl, FALSE );
          }
          '''
          if old_stub not in text:
              raise SystemExit("Heap32ListFirst stub anchor not found")
          text = text.replace(old_stub, new_stub, 1)

          toolhelp.write_text(text)

          spec_text = spec.read_text()
          if "@ stub Heap32ListNext" not in spec_text:
              raise SystemExit("kernel32.spec Heap32ListNext stub not found")
          spec.write_text(spec_text.replace("@ stub Heap32ListNext",
                                            "@ stdcall Heap32ListNext(long ptr)", 1))
          PY

          git -C wine-src diff --check

      - name: Set up Termux sysroot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/termuxfs/x86_64"
          cd "$HOME/termuxfs/x86_64"
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-x86_64.tar
          tar -xf termuxfs-x86_64.tar

      - name: Set up Android NDK r27d
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Android/Sdk/ndk"
          cd "$HOME/Android/Sdk/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Set up LLVM MinGW
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: GameNative official autogen
        working-directory: wine-src
        run: |
          set -euo pipefail
          bash build-scripts/build-step0-autogen.sh

      - name: Build Wine host tools
        working-directory: wine-src
        run: |
          set -euo pipefail
          bash build-scripts/build-step0.sh

      - name: Configure Android x86_64 with official GameNative patches
        working-directory: wine-src
        run: |
          set -euo pipefail
          bash build-scripts/build-step-x86_64.sh --configure

      - name: Build Android x86_64
        working-directory: wine-src
        run: |
          set -euo pipefail
          bash build-scripts/build-step-x86_64.sh --build

      - name: Install Android x86_64
        working-directory: wine-src
        run: |
          set -euo pipefail
          bash build-scripts/build-step-x86_64.sh --install

      - name: Package WCP
        run: |
          set -euo pipefail
          OUT="$HOME/compiled-files-x86_64"
          test -x "$OUT/bin/wine"
          test -d "$OUT/lib/wine"

          wget -q \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-x86_64-11.txz \
            -O "$OUT/prefixPack.txz"

          cat > "$OUT/profile.json" <<'JSON'
          {
            "type": "Proton",
            "versionName": "11.0-407-x86_64",
            "versionCode": 8,
            "description": "GameNative Proton 11 Android x86_64 - 4Story GameGuard compatibility v8. GameGuard remains enabled.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          JSON

          cd "$OUT"
          tar cJf "$GITHUB_WORKSPACE/4story-gamenative-p11-gg-x86_64-v8.wcp" \
            bin lib share prefixPack.txz profile.json
          cd "$GITHUB_WORKSPACE"
          sha256sum 4story-gamenative-p11-gg-x86_64-v8.wcp > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4story-gamenative-p11-gg-x86_64-v8
          path: |
            4story-gamenative-p11-gg-x86_64-v8.wcp
            SHA256SUMS
          retention-days: 30
